<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#203952" />
  <title>MedMinds Sales Agent | Offline</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f6fbfb; color: #203952; }
    main { width: min(100%, 480px); background: #fff; border: 1px solid #dce8e8; border-radius: 24px; padding: 32px 28px; box-shadow: 0 18px 50px rgba(32,57,82,.10); text-align: center; }
    img { display: block; width: min(100%, 280px); height: auto; margin: 0 auto 28px; }
    .status { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: #eef8f6; color: #17786f; font-size: 13px; font-weight: 700; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #2faf9f; }
    h1 { margin: 22px 0 10px; font-size: clamp(28px, 7vw, 38px); line-height: 1.05; }
    p { margin: 0 auto; max-width: 360px; color: #60717f; line-height: 1.6; }
    button { margin-top: 24px; border: 0; border-radius: 14px; padding: 13px 18px; background: #203952; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    small { display: block; margin-top: 22px; color: #8a9aa5; }
  </style>
</head>
<body>
  <main>
    <img src="/medminds-logo.png" alt="MedMinds Learning Centre" />
    <div class="status"><span class="dot"></span>Connection unavailable</div>
    <h1>You are offline</h1>
    <p>Reconnect to continue with client conversations, payments and business intelligence. Sensitive MedMinds data is never stored for offline access.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <small>MedMinds Sales Agent</small>
  </main>
</body>
</html>
